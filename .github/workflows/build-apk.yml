name: Build APK

# Builds a debug APK and publishes it as the "latest" release, so it can be
# downloaded and installed straight from a phone browser — no local toolchain.
on:
  push:
    branches:
      - claude/maps-voice-module-geqruj
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch the offline wake-word model
        run: |
          curl -sSfL -o model.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          rm model.zip

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" \
            --notes "Debug build of ${{ github.sha }}. Install on your phone, then paste your Claude API key into the app on first run."
